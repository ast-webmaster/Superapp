name: Create Production Builds

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the builds to the App Store and Google Play after they finish
        type: boolean
        default: false

jobs:
  checks:
    name: Lint, typecheck and test
    type: custom
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Test
        run: npm test -- --ci

  build_android:
    name: Build Android
    needs: [checks]
    type: build
    environment: production
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [checks]
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android
    needs: [build_android]
    if: ${{ inputs.submit }}
    type: submit
    environment: production
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios:
    name: Submit iOS
    needs: [build_ios]
    if: ${{ inputs.submit }}
    type: submit
    environment: production
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
