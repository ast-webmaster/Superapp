name: Create Preview Builds

on:
  pull_request:
    branches: ['master']

jobs:
  checks:
    name: Lint, typecheck and test
    type: custom
    environment: preview
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx expo lint
      - name: Test
        run: npm test -- --ci

  build_android:
    name: Build Android preview
    needs: [checks]
    type: build
    environment: preview
    params:
      platform: android
      profile: preview
